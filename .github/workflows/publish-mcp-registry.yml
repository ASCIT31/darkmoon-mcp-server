name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# using GitHub OIDC. No stored secret: the io.github.ASCIT31/* namespace is proven by the
# workflow identity. Run manually after the matching npm version is published.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install mcp-publisher
        run: |
          gh release download v1.8.1 -R modelcontextprotocol/registry -p mcp-publisher_linux_amd64.tar.gz
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check server.json matches package.json
        run: |
          test "$(jq -r .version server.json)" = "$(jq -r .version package.json)"
          test "$(jq -r .mcpName package.json)" = "$(jq -r .name server.json)"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
